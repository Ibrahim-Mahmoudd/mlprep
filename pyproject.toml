[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"


[project]
name = "mlprep"
version = "0.1.0"
description = "A configurable, leakage-safe framework for preparing tabular data for machine learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Ibrahim Mansour" }
]

keywords = [
    "machine-learning",
    "data-science",
    "data-preprocessing",
    "data-validation",
    "feature-engineering",
    "tabular-data",
    "data-quality",
    "leakage-prevention"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.8,<4.0",
    "typing-extensions>=4.12,<5.0"
]

[project.optional-dependencies]
resampling = [
    "imbalanced-learn>=0.12,<1.0"
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0"
]


[project.urls]
Homepage = "https://github.com/your-username/mlprep"
Repository = "https://github.com/your-username/mlprep"
Issues = "https://github.com/your-username/mlprep/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/mlprep"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]


[tool.coverage.run]
source = ["mlprep"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80


[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF"
]

ignore = []


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

strict = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true

files = [
    "src/mlprep"
]


[[tool.mypy.overrides]]
module = [
    "pandas.*"
]
ignore_missing_imports = true
