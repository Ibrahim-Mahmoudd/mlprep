config_version: "1"
phase1:
  problem_contract:
    task_type: multiclass_classification
    target_column: target
    unit_of_observation: one row
  column_roles:
    target_column: target
    feature_columns:
      - feature_a
      - feature_b
  target_validation:
    target_column: target
    task_type: multiclass_classification
  leakage_risks:
    target_column: target
phase2:
  strategy: stratified
  random_seed: 42
  split_roles:
    target_column: target
    feature_columns:
      - feature_a
      - feature_b
cross_validation:
  strategy: stratified
  n_splits: 5
  random_seed: 42
pipeline:
  output_directory: null
  save_intermediate_states: true
