config_version: "1"
phase1:
  problem_contract:
    task_type: binary_classification
    target_column: target
    positive_class: 1
    unit_of_observation: one row per entity
    group_columns:
      - group_id
  column_roles:
    target_column: target
    feature_columns:
      - feature_a
      - feature_b
    group_columns:
      - group_id
  target_validation:
    target_column: target
    task_type: binary_classification
    positive_class: 1
  leakage_risks:
    target_column: target
phase2:
  strategy: group
  random_seed: 42
  split_roles:
    target_column: target
    feature_columns:
      - feature_a
      - feature_b
    group_columns:
      - group_id
cross_validation:
  strategy: group
  n_splits: 5
  random_seed: 42
pipeline:
  output_directory: null
  save_intermediate_states: true
